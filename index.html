        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') { doSearch(); document.getElementById('searchInput').blur(); }
        });

        function doSearch() {
            const input = document.getElementById('searchInput').value.trim();
            const resultBody = document.getElementById('resultBody');
            const tableWrapper = document.getElementById('tableWrapper');
            const resultInfo = document.getElementById('resultInfo');
            
            resultBody.innerHTML = '';
            
            if (input.length === 0) { alert("請輸入名字"); return; }

            const results = db.filter(item => {
                if (item.head_name.includes(input)) return true;
                if (item.members && item.members.some(m => m.includes(input))) return true;
                return false;
            });

            if (results.length === 0) {
                resultInfo.innerHTML = "查無包含 <span class='highlight'>" + input + "</span> 的資料";
                tableWrapper.style.display = 'none';
            } else {
                resultInfo.innerHTML = "搜尋 <span class='highlight'>" + input + "</span> 找到 " + results.length + " 筆：";
                tableWrapper.style.display = 'block';
                
                results.forEach(res => {
                    let row = document.createElement('tr');
                    
                    let headHtml = res.head_name;
                    if (headHtml.includes(input)) {
                        headHtml = highlight(headHtml, input);
                    }

                    let memberNote = '';
                    if (res.members && res.members.length > 0) {
                        let matchedMembers = res.members.filter(m => m.includes(input));
                        if (matchedMembers.length > 0) {
                            let memberStr = matchedMembers.map(m => highlight(m, input)).join('、');
                            memberNote = `<div class="member-match">(成員: ${memberStr})</div>`;
                        }
                    }

                    row.innerHTML = `
                        <td class="folder-cell">${res.folder}</td>
                        <td>${res.id}</td>
                        <td>P.${res.page}</td>
                        <td>${headHtml} ${memberNote}</td>
                    `;
                    resultBody.appendChild(row);
                });
            }
        }

        function highlight(text, keyword) {
            const regex = new RegExp(keyword, 'g');
            return text.replace(regex, `<span class="highlight">${keyword}</span>`);
        }
